     1|name: Lint
     2|
     3|on:
     4|  push:
     5|    branches: [main, master]
     6|  pull_request:
     7|
     8|permissions:
     9|  contents: read
    10|
    11|jobs:
    12|  lint:
    13|    runs-on: ubuntu-latest
    14|    env:
    15|      HUSKY: 0
    16|    steps:
    17|      - uses: actions/checkout@v4
    18|
    19|      - name: Setup Node.js
    20|        uses: actions/setup-node@v4
    21|        with:
    22|          node-version: '22'
    23|
    24|      - name: Install dependencies
    25|        run: npm install --legacy-peer-deps --ignore-scripts
    26|
    27|      - name: Run Prettier check
    28|        run: npx prettier --check "src/**/*.{ts,tsx,js,jsx,json,css,md}"
    29|
    30|      - name: Run ESLint
    31|        run: npm run lint --format json --output-file eslint-report.json || true
    32|        continue-on-error: true
    33|
    34|      - name: Run TypeScript type check
    35|        run: npx tsc --noEmit
    36|        continue-on-error: true
