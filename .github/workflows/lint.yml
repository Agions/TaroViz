name: Lint

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --legacy-peer-deps --ignore-scripts

      - name: Debug environment
        run: |
          echo "node: $(node --version)"
          echo "npm: $(npm --version)"
          ls node_modules/.bin/prettier 2>&1 || echo "prettier binary NOT found"
          npx prettier --version 2>&1 || echo "npx prettier FAILED"
          npm run lint:prettier 2>&1 || echo "npm run lint:prettier FAILED"

      - name: Run Prettier check
        run: npm run lint:prettier

      - name: Run ESLint
        run: npm run lint --format json --output-file eslint-report.json || true
        continue-on-error: true

      - name: Run TypeScript type check
        run: npx tsc --noEmit
