     1|name: Publish to npm
     2|
     3|on:
     4|  release:
     5|    types: [published]
     6|  workflow_dispatch:
     7|    inputs:
     8|      version:
     9|        description: 'Version to publish (e.g., 1.2.0)'
    10|        required: false
    11|        type: string
    12|
    13|jobs:
    14|  publish:
    15|    name: Publish to npm
    16|    runs-on: ubuntu-latest
    17|    env:
    18|      HUSKY: 0
    19|    permissions:
    20|      contents: read
    21|      packages: write
    22|      id-token: write
    23|    steps:
    24|      - name: Checkout
    25|        uses: actions/checkout@v4
    26|
    27|      - name: Setup Node.js
    28|        uses: actions/setup-node@v4
    29|        with:
    30|          node-version: '22'
    31|          registry-url: 'https://registry.npmjs.org'
    32|
    33|      - name: Install dependencies
    34|        run: npm install --legacy-peer-deps --ignore-scripts
    35|
    36|      - name: Build
    37|        run: npm run build
    38|
    39|      - name: Publish to npm
    40|        run: npm publish --access public
